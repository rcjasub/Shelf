spring.application.name=backend
server.port=8081

app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
# Public OAuth Client ID from Google Cloud Console (Credentials > OAuth 2.0 Client IDs).
google.client-id=${GOOGLE_CLIENT_ID:}
# 32+ random bytes, base64-encoded. Generate with: openssl rand -base64 32
app.jwt-secret=${JWT_SECRET:}
# Cookies require HTTPS when true - leave false for local http dev, set true in any real deployment.
app.secure-cookies=${SECURE_COOKIES:false}
