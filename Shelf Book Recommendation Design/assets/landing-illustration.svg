<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a9a92"></stop>
      <stop offset="45%" stop-color="#a8b3a8"></stop>
      <stop offset="100%" stop-color="#c9cfc2"></stop>
    </linearGradient>
    <linearGradient id="farRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8a7e"></stop>
      <stop offset="100%" stop-color="#9aa495"></stop>
    </linearGradient>
    <linearGradient id="midRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f4f3d"></stop>
      <stop offset="100%" stop-color="#5a6a53"></stop>
    </linearGradient>
    <linearGradient id="nearCliff" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#26301f"></stop>
      <stop offset="100%" stop-color="#12160d"></stop>
    </linearGradient>
    <linearGradient id="treeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2b17"></stop>
      <stop offset="100%" stop-color="#0d130a"></stop>
    </linearGradient>
    <linearGradient id="towerShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a2b26"></stop>
      <stop offset="100%" stop-color="#4a4b42"></stop>
    </linearGradient>
    <radialGradient id="fogGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e4e8dc" stop-opacity="0.9"></stop>
      <stop offset="100%" stop-color="#e4e8dc" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

